# Foundation stack (specs/001-foundation-data-layer).
# - No service uses env_file: secrets reach containers only as files under /run/secrets.
# - The backup service lives in compose.backup.yaml (loaded by `make up` only when an age key exists).
name: platform

networks:
  platform: {}

volumes:
  pgdata:
  mail_capture:
  backup_local:
  caddy_data:
  caddy_config:

secrets:
  postgres_superuser_password:
    file: ./secrets/postgres_superuser_password
  app_owner_password:
    file: ./secrets/app_owner_password
  sync_writer_password:
    file: ./secrets/sync_writer_password
  agent_ro_password:
    file: ./secrets/agent_ro_password
  backup_ro_password:
    file: ./secrets/backup_ro_password
  api_rw_password:
    file: ./secrets/api_rw_password
  auth_pepper:
    file: ./secrets/auth_pepper
  api_external:
    file: ./secrets/api_external
  source_sqlserver:
    file: ./secrets/source_sqlserver

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    secrets:
      - postgres_superuser_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # loopback only, in every environment (plan R-9)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - platform
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(redis-cli ping)\" = \"PONG\" ]"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot, idempotent: extensions, schemas, roles, grants. Re-runs on every `make up`
  # (rotating a secret file and restarting re-syncs the role passwords).
  db-init:
    image: pgvector/pgvector:pg16
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: ${POSTGRES_DB:-platform}
    entrypoint: ["/bin/sh", "/bootstrap/run.sh"]
    secrets:
      - postgres_superuser_password
      - app_owner_password
      - sync_writer_password
      - agent_ro_password
      - backup_ro_password
      - api_rw_password
    volumes:
      - ./db/bootstrap:/bootstrap:ro
    networks:
      - platform

  # One-shot: applies pending SQL migrations as app_owner (tracked in app.schema_migrations).
  migrate:
    image: amacneil/dbmate:2
    restart: "no"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_MIGRATIONS_TABLE: app.schema_migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'DATABASE_URL="postgres://app_owner:$$(cat /run/secrets/app_owner_password)@postgres:5432/$${POSTGRES_DB}?sslmode=disable"; export DATABASE_URL; exec dbmate migrate'
    secrets:
      - app_owner_password
    volumes:
      - ./db/migrations:/db/migrations:ro
    networks:
      - platform

  # The API (future Agent Platform backend): sign-in, sessions, allowlist, audit.
  api:
    build:
      context: ./api
      target: runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-development}
      MAIL_BACKEND: ${MAIL_BACKEND:-capture}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://vcp.onepercentdata.site}
      CODE_RATE_PER_EMAIL: ${CODE_RATE_PER_EMAIL:-5}
      CODE_RATE_PER_IP: ${CODE_RATE_PER_IP:-20}
      VERIFY_RATE_PER_IP: ${VERIFY_RATE_PER_IP:-30}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      MAIL_CAPTURE_TTL_MINUTES: ${MAIL_CAPTURE_TTL_MINUTES:-60}
      SYNC_REQUEST_TTL_MINUTES: ${SYNC_REQUEST_TTL_MINUTES:-15}
    secrets:
      - api_rw_password
      - auth_pepper
      - api_external
    tmpfs:
      - /run/api-secrets:mode=0500
    volumes:
      - mail_capture:/var/mail-capture
    networks:
      - platform
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # The sync worker (specs/004-sales-contract-sync): copies dbo.sales_contract from SQL Server into
  # serving.sales_contract. Only this service holds the source credentials. With an empty
  # secrets/source_sqlserver it idles (healthy) and says so in its log.
  sync:
    build:
      context: ./sync
      target: runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-10}
      SYNC_POLL_SECONDS: ${SYNC_POLL_SECONDS:-5}
      SOURCE_SNAPSHOT_READ: ${SOURCE_SNAPSHOT_READ:-off}
      SOURCE_READ_TIMEOUT_SECONDS: ${SOURCE_READ_TIMEOUT_SECONDS:-300}
      SOURCE_ENCRYPT: ${SOURCE_ENCRYPT:-require}
      SYNC_RETRY_ATTEMPTS: ${SYNC_RETRY_ATTEMPTS:-3}
      SYNC_RETRY_BASE_SECONDS: ${SYNC_RETRY_BASE_SECONDS:-15}
      GUARD_MIN_FRACTION: ${GUARD_MIN_FRACTION:-0.5}
      GUARD_MIN_ROWS: ${GUARD_MIN_ROWS:-1000}
      SWAP_LOCK_TIMEOUT_SECONDS: ${SWAP_LOCK_TIMEOUT_SECONDS:-15}
      SYNC_STALE_MINUTES: ${SYNC_STALE_MINUTES:-30}
      SYNC_FAILING_AFTER: ${SYNC_FAILING_AFTER:-3}
      SYNC_LOG_RETENTION_DAYS: ${SYNC_LOG_RETENTION_DAYS:-30}
      SYNC_REQUEST_TTL_MINUTES: ${SYNC_REQUEST_TTL_MINUTES:-15}
    secrets:
      - sync_writer_password
      - source_sqlserver
    tmpfs:
      - /run/sync-secrets:mode=0500
    networks:
      - platform
    healthcheck:
      test: ["CMD", "python", "-m", "sync", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Tests for the sync worker. Only used through `make test-sync`, in an isolated Compose project.
  sync-test:
    build:
      context: ./sync
      target: test
    profiles: ["test"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      API_TEST_ISOLATED: ${API_TEST_ISOLATED:-0}
    secrets:
      - sync_writer_password
      - source_sqlserver
      - app_owner_password
      # the permission tests log in as these roles (test project only)
      - agent_ro_password
      - api_rw_password
    volumes:
      # lets the drift test compare the committed column dictionary with the definition
      - ./docs/data:/repo-docs/data:ro
    networks:
      - platform

  # Integration tests for the API. Only used through `make test-api`, in an isolated Compose project.
  api-test:
    build:
      context: ./api
      target: test
    profiles: ["test"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      MAIL_BACKEND: capture
      PUBLIC_ORIGIN: https://test.example
      API_TEST_ISOLATED: ${API_TEST_ISOLATED:-0}
      SYNC_REQUEST_TTL_MINUTES: ${SYNC_REQUEST_TTL_MINUTES:-15}
    secrets:
      - api_rw_password
      - auth_pepper
      - api_external
      - app_owner_password
      - sync_writer_password
    volumes:
      # the admin sync tests create the control tables from the worker's own SQL (as sync_writer)
      - ./sync/sql:/sync-sql:ro
      - ./sync/tests/state_cases.json:/sync-tests/state_cases.json:ro
    networks:
      - platform

  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-vcp.onepercentdata.site}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - platform
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
