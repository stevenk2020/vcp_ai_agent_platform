[project]
name = "platform-foundation-tests"
version = "0.1.0"
description = "Acceptance tests for the foundation data layer (specs/001-foundation-data-layer)"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8",
    "psycopg[binary]>=3.2",
]

[tool.pytest.ini_options]
testpaths = ["foundation"]
markers = [
    "slow: tests that take more than ~30 seconds (for example the statement_timeout test)",
]
